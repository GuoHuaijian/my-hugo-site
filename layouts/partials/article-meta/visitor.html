{{ if .Site.Params.analytics.enable }}
<span class="inline-flex items-center gap-1 text-sm">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
  </svg>
  <span id="page-pv">--</span> 次阅读
</span>

<script>
  (function () {
    const API_BASE = "{{ .Site.Params.analytics.api }}";
    const page = encodeURIComponent(window.location.pathname);

    fetch(`${API_BASE}/api/page-stats?page=${page}`)
            .then(res => res.json())
            .then(data => {
              document.getElementById("page-pv").textContent = data.pv || 0;
            })
            .catch(() => {});
  })();
</script>
{{ end }}
